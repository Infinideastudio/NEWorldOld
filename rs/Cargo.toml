[package]
name = "neworld"
version = "0.5.0"
edition = "2024"
description = "NEWorld is an open-source voxel game with similar gameplay as Minecraft."
license = "CC0-1.0"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"

[dependencies]
# Math — chosen over glam so Aabb3<S>/Euler<S>/Frustum<S> can be true generics.
cgmath = { version = "0.18", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Errors
thiserror = "2"
anyhow = "1"

# Serialization (used across config, i18n, blocks, items, player)
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Per-module dependencies (kept minimal in foundations layer)
bytemuck = { version = "1.18", features = ["derive"] }

# World-layer deps:
# - slab: O(1) key-addressable arena for chunks (see migration plan §2.2)
# - sled: pure-Rust K/V store backing TilesStore (replaces LevelDB)
# - bincode: binary serde format for player save
slab = "0.4"
sled = "0.34"
bincode = { version = "2", features = ["serde"] }

# Graphics-layer deps (`[C]` in the migration plan):
# - winit: cross-platform windowing + event loop (0.30 ApplicationHandler API).
# - wgpu: cross-platform GPU abstraction (replaces the C++ GL wrappers).
# - pollster: tiny synchronous executor for the wgpu adapter/device requests.
# - raw-window-handle: window-handle interop (declared explicitly even though
#   it's usually pulled transitively).
# - image: PNG decode for block + UI atlases (replaces the C++ image_io path).
# - glyphon: cosmic-text shaping + wgpu glyph atlas (replaces FreeType + the
#   hand-rolled glyph atlas in `text_rendering.ixx`).
winit = "0.30"
wgpu = "29.0.1"
pollster = "0.4.0"
raw-window-handle = "0.6.2"
image = "0.25.10"
glyphon = "0.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1
